<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chandam Icon Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@400;500;600;700;800&family=Tiro+Telugu:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Anek Telugu', sans-serif;
  background: #faf8f5;
  color: #1a1a1a;
  line-height: 1.6;
}

.page-header {
  padding: 24px 32px;
  border-bottom: 1px solid #d4cfc8;
}

.page-header h1 {
  font-size: 1.25rem;
  font-weight: 500;
  color: #1a3a5c;
}

section {
  padding: 32px;
}

.section-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: #5c5c5c;
  letter-spacing: 0.02em;
  margin-bottom: 16px;
}

.showcase {
  display: flex;
  gap: 48px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.variant {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant svg, .variant object {
  width: var(--icon-size, 128px);
  height: var(--icon-size, 128px);
  transition: width 0.3s ease-out, height 0.3s ease-out;
}

.variant-label {
  font-size: 0.9rem;
  color: #5c5c5c;
}

.size-presets {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 24px 32px;
  border-top: 1px solid #e8e4de;
  border-bottom: 1px solid #e8e4de;
}

.size-btn {
  font-family: 'Anek Telugu', sans-serif;
  font-size: 0.85rem;
  padding: 6px 14px;
  border: 1px solid #d4cfc8;
  border-radius: 3px;
  background: #ffffff;
  color: #1a3a5c;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.size-btn:hover {
  background: #f4f1ec;
  border-color: #1a3a5c;
}

.size-btn.active {
  background: #1a3a5c;
  color: #f5f3f0;
  border-color: #1a3a5c;
}

.context-dark {
  background: #1a1a1a;
  border-radius: 6px;
  padding: 24px 32px;
  margin-bottom: 24px;
}

.context-dark .section-label {
  color: #a0a0a0;
}

.context-row {
  display: flex;
  gap: 48px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.context-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.context-item object {
  width: 40px;
  height: 40px;
}

.context-item .brand-text {
  font-size: 1.25rem;
  font-weight: 400;
}

.context-dark .brand-text {
  color: #f5f3f0;
}

.context-light {
  background: #faf8f5;
  border: 1px solid #d4cfc8;
  border-radius: 6px;
  padding: 24px 32px;
}

.context-light .context-item object {
  width: 64px;
  height: 64px;
}

.context-light .brand-text {
  font-size: 1.5rem;
  color: #1a3a5c;
}

.favicon-row {
  display: flex;
  gap: 32px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}

.favicon-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.favicon-pair {
  display: flex;
  gap: 12px;
  align-items: center;
}

.favicon-dark {
  background: #1a1a1a;
  padding: 8px;
  border-radius: 3px;
}

.favicon-light {
  background: #faf8f5;
  border: 1px solid #d4cfc8;
  padding: 8px;
  border-radius: 3px;
}

.favicon-pair object {
  display: block;
}

.favicon-label {
  font-size: 0.75rem;
  color: #5c5c5c;
}
</style>
